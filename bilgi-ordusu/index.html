<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bilgi Ordusu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: phone-first game shell — resource bar on top, one full-height view in the middle (cloud-covered island map, battle, shop, ranking…), raised tab bar at the bottom. Navy + gold frames, cream cards, chunky outlined type. */
:root {
  --navy: #1a3d78; --navy2: #102a57; --navy3: #0b1d3f;
  --gold: #ffd040; --gold2: #f0a91a; --gold3: #b8740a;
  --cream: #fff5df; --cream2: #f3e3bf;
  --green: #5fd13a; --green2: #2f9e1e; --green3: #1f6e12;
  --red: #ef4656; --red2: #b81f34;
  --sea: #1f6fb8; --sea2: #2b8fd6;
  --ink: #1d2340; --ink2: #6a5a48;
  --display: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(120% 80% at 50% 0%, #2f78c8 0%, #17478f 55%, #0c2754 100%); color: var(--ink); font-family: var(--body); font-weight: 600; overflow: hidden; }
.app { position: relative; height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; background: var(--navy3); box-shadow: 0 0 60px rgba(0, 0, 0, .45); overflow: hidden; }
.ol { color: #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .35), 2px 0 0 var(--navy3), -2px 0 0 var(--navy3), 0 2px 0 var(--navy3), 0 -2px 0 var(--navy3), 1.5px 1.5px 0 var(--navy3), -1.5px 1.5px 0 var(--navy3), 1.5px -1.5px 0 var(--navy3), -1.5px -1.5px 0 var(--navy3); }
button { font-family: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* Üst kaynak çubuğu */
.topbar {
  position: relative; z-index: 30; flex: none; display: flex; align-items: center; gap: 6px;
  margin: calc(env(safe-area-inset-top, 0px) + 8px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
  padding: 6px 8px 6px 70px; min-height: 52px; border-radius: 30px;
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); border: 3px solid var(--gold); box-shadow: 0 4px 0 var(--gold3), 0 10px 20px rgba(0, 0, 0, .35);
}
.avatarbtn { position: absolute; left: -6px; top: 50%; transform: translateY(-50%); width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--gold); background: radial-gradient(circle at 50% 35%, #6fc4ff, #2a74c8); padding: 0; cursor: pointer; box-shadow: 0 4px 0 var(--gold3), 0 8px 16px rgba(0, 0, 0, .4); overflow: hidden; }
.avatarbtn canvas { width: 100%; height: 100%; display: block; }
.res { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 10px 0 4px; border-radius: 18px; background: linear-gradient(180deg, #fffaf0, #f1e1c0); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .1); position: relative; }
.res b { flex: 1; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ico { flex: none; display: grid; place-items: center; width: 34px; height: 34px; margin-left: -10px; border-radius: 50%; font-family: var(--display); font-weight: 700; font-size: .95rem; color: #fff; }
.ico.coin { background: radial-gradient(circle at 35% 30%, #fff3a6 0 14%, #ffd040 34%, #e39a0c 100%); box-shadow: inset 0 0 0 3px #f7b81e, 0 2px 4px rgba(0, 0, 0, .3); }
.ico.coin::after { content: "B"; color: #b06a00; font-size: 1rem; }
.ico.heart { background: none; width: 36px; height: 34px; }
.ico.heart svg { position: absolute; width: 36px; height: 34px; }
.ico.heart span { position: relative; font-size: 1rem; }
.ico.star { background: none; }
.ico.star svg { width: 34px; height: 34px; }
.plus { position: absolute; left: 14px; bottom: -6px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; background: var(--green2); color: #fff; font-weight: 800; font-size: .9rem; line-height: 1; padding: 0; cursor: pointer; }
.gear { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--gold); background: radial-gradient(circle at 40% 35%, #ffd36a, #f08a12); color: #fff; font-size: 1.25rem; cursor: pointer; box-shadow: 0 3px 0 var(--gold3); padding: 0; }
.battlebar { display: none; }
.app.inbattle .res.stars { display: none; }

/* Görünümler */
.views { position: relative; flex: 1; min-height: 0; margin-top: 8px; }
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
.view[hidden] { display: none !important; }
.pagehead { position: sticky; top: 0; z-index: 5; text-align: center; padding: 10px 16px 14px; background: linear-gradient(180deg, #b0263f, #8c1730); border-bottom: 4px solid var(--gold); }
.pagehead h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 2rem; letter-spacing: .01em; }
.pagehead p { margin: 2px 0 0; color: #ffe8c0; font-size: .85rem; }
.pagebody { padding: 14px max(12px, env(safe-area-inset-right, 0px)) 120px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, #1f3e74, #142c58); min-height: 100%; box-sizing: border-box; }

/* Ana ekran: bulutlu harita */
.home { background: var(--sea); overflow: hidden; }
.map3d { position: absolute; inset: 0; background: #1f6fb8; }
.map3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.labels3 { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl3 { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; padding: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; will-change: transform; }
.lbl3 .pin { position: relative; width: 30px; height: 38px; }
.lbl3 .pin svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .4)); }
.lbl3 .pl { position: absolute; left: 0; right: 0; top: 7px; text-align: center; font-family: var(--display); font-weight: 700; font-size: .62rem; color: #fff; }
.lbl3 .nm { margin-top: -2px; font-family: var(--display); font-weight: 700; font-size: .78rem; white-space: nowrap; padding: 1px 8px; border-radius: 10px; background: rgba(16, 42, 87, .78); color: #fff; display: none; }
.lbl3.sel .nm, .lbl3:hover .nm, .lbl3:focus-visible .nm, .lbl3.done .nm, .lbl3.open .nm { display: block; }
.lbl3.locked .nm { background: rgba(60, 60, 70, .7); }
.lbl3.sel .pin { animation: bob 1s ease-in-out infinite; }
.lbl3.sel .pin svg { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 3px 2px rgba(0, 0, 0, .4)); }
@keyframes bob { 50% { transform: translateY(-6px); } }
.lbl3.world .nm { display: block; }
.homeTop { position: absolute; left: 0; right: 0; top: 10px; display: flex; justify-content: center; pointer-events: none; z-index: 4; }
.banner { pointer-events: auto; font-family: var(--display); font-weight: 700; font-size: 1rem; padding: 8px 16px; border-radius: 18px; background: linear-gradient(180deg, #fffaf0, #f3e3bf); color: var(--ink); border: 3px solid var(--gold); box-shadow: 0 4px 0 var(--gold3); max-width: 86%; text-align: center; }
.sheet {
  position: absolute; left: 10px; right: 10px; bottom: 182px; z-index: 4; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: 20px; background: linear-gradient(180deg, #fffaf0, var(--cream2)); border: 3px solid var(--gold); box-shadow: 0 5px 0 var(--gold3), 0 12px 24px rgba(0, 0, 0, .35);
}
.sheet canvas { width: 64px; height: 64px; border-radius: 14px; background: radial-gradient(circle, #d6efff, #9ccdf3); }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.2rem; line-height: 1.1; color: var(--ink); }
.sheet .sub { font-size: .72rem; font-weight: 800; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
.sheet .foe { margin: 2px 0 0; font-weight: 800; color: var(--red2); font-size: .9rem; }
.sheet .lore { margin: 2px 0 0; font-size: .8rem; color: var(--ink2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sheet .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(29, 35, 64, .08); color: var(--ink); }
.tag.ok { background: #d8f5c8; color: var(--green3); } .tag.lock { background: #e8e0d4; color: #6a5a48; } .tag.go { background: #ffe2b8; color: #9a4a00; }
.actions { position: absolute; left: 0; right: 0; bottom: 92px; z-index: 5; display: grid; grid-template-columns: 1fr 2.4fr 1fr; align-items: end; gap: 8px; padding: 0 10px; }
.roundbtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; border: 0; background: none; cursor: pointer; padding: 0; }
.roundbtn .art { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .4)); transition: transform .15s; }
.roundbtn:hover .art { transform: translateY(-3px) scale(1.04); }
.roundbtn .art svg { width: 100%; height: 100%; }
.roundbtn b { margin-top: -10px; font-family: var(--display); font-weight: 700; font-size: .95rem; padding: 4px 14px; border-radius: 12px; background: linear-gradient(180deg, #c42c46, #8c1730); border: 2px solid var(--gold); box-shadow: 0 3px 0 var(--gold3); }
.badge { position: absolute; top: -4px; right: 6px; min-width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--red); color: #fff; font-family: var(--display); font-weight: 700; font-size: .85rem; border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .4); }
.badge:empty { display: none; }
.play {
  border: 4px solid var(--gold); border-radius: 22px; cursor: pointer; padding: 14px 10px; min-height: 72px;
  background: linear-gradient(180deg, #8ef05a 0%, var(--green) 45%, var(--green2) 100%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), 0 5px 0 var(--gold3), 0 12px 20px rgba(0, 0, 0, .35);
  font-family: var(--display); font-weight: 700; font-size: clamp(1.2rem, 5vw, 1.75rem); line-height: 1.05; transition: transform .12s;
}
.play small { display: block; font-size: .75rem; font-weight: 700; opacity: .95; }
.play:active { transform: scale(.96); }
.play:disabled { filter: grayscale(.7) brightness(.9); cursor: not-allowed; }
.maphint { position: absolute; right: 10px; top: 54px; z-index: 4; font-size: .7rem; font-weight: 800; color: #fff; background: rgba(16, 42, 87, .6); border-radius: 10px; padding: 4px 8px; pointer-events: none; }
.mapprog { position: absolute; left: 10px; top: 54px; z-index: 4; font-family: var(--display); font-weight: 700; font-size: .85rem; color: var(--ink); background: linear-gradient(180deg, #fffaf0, var(--cream2)); border: 2px solid var(--gold); border-radius: 12px; padding: 3px 10px; box-shadow: 0 3px 0 var(--gold3); pointer-events: none; }

/* Alt sekme çubuğu */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: 80px; padding-bottom: env(safe-area-inset-bottom, 0px); background: linear-gradient(180deg, #b0263f, #7c1029); border-top: 4px solid var(--gold); }
.tab { height: 76px; border: 0; border-right: 2px solid rgba(0, 0, 0, .2); background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; transition: transform .15s; }
.tab:last-child { border-right: 0; }
.tab svg { width: 46px; height: 46px; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .35)); transition: transform .2s; }
.tab span { font-family: var(--display); font-weight: 700; font-size: .82rem; display: none; }
.tab[aria-current="page"] { height: 98px; margin-top: -22px; border-radius: 22px 22px 0 0; background: linear-gradient(180deg, #d6385a, #9c1a36); border: 4px solid var(--gold); border-bottom: 0; }
.tab[aria-current="page"] svg { transform: scale(1.2) translateY(-4px); }
.tab[aria-current="page"] span { display: block; }
.app.inbattle .tabbar { display: none; }

/* Savaş */
.battle { padding: 4px max(10px, env(safe-area-inset-right, 0px)) 20px max(10px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.stage { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 960 / 588; width: 100%; background: #9fdcff; border: 3px solid var(--gold); box-shadow: 0 5px 0 var(--gold3), 0 12px 24px rgba(0, 0, 0, .4); }
.stage canvas { display: block; width: 100%; height: 100%; }
.citybadge { position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 7px; background: linear-gradient(180deg, #fffaf0, var(--cream2)); border: 2px solid var(--gold); border-radius: 14px; padding: 4px 10px 4px 4px; box-shadow: 0 3px 0 var(--gold3); max-width: calc(50% - 20px); }
.citybadge img { width: 36px; height: 24px; border-radius: 4px; display: block; flex: none; }
.citybadge div { display: flex; flex-direction: column; min-width: 0; }
.citybadge b { font-family: var(--display); font-weight: 700; font-size: clamp(.7rem, 2.4vw, 1rem); line-height: 1.1; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citybadge small { font-size: clamp(.55rem, 1.8vw, .7rem); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.backbtn { position: absolute; right: 8px; top: 8px; font-family: var(--display); font-weight: 700; font-size: .8rem; background: linear-gradient(180deg, #c42c46, #8c1730); color: #fff; border: 2px solid var(--gold); border-radius: 12px; padding: 5px 10px; cursor: pointer; box-shadow: 0 3px 0 var(--gold3); }
.bosshp { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(36%, 300px); display: flex; flex-direction: column; gap: 3px; align-items: center; pointer-events: none; }
.bosshp small { font-family: var(--display); font-weight: 700; font-size: clamp(.55rem, 2vw, .85rem); text-align: center; }
.bar { width: 100%; height: 12px; border-radius: 999px; background: #3a1018; border: 2px solid var(--gold); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg, #ff8a8a, var(--red)); transition: width .5s; }
@media (max-width: 420px) { .bosshp { top: auto; bottom: 6px; width: 56%; } }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 14px; background: rgba(12, 30, 66, .72); backdrop-filter: blur(3px); }
.overlay h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 7vw, 3rem); line-height: 1; }
.overlay p { margin: 0; max-width: 40ch; color: #fff; font-size: clamp(.8rem, 2.6vw, 1rem); line-height: 1.4; }
.reward { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 1.2rem; color: var(--ink); background: linear-gradient(180deg, #fffaf0, var(--cream2)); border: 2px solid var(--gold); border-radius: 14px; padding: 4px 12px; }
.reward:empty { display: none; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.gbtn { border: 3px solid var(--gold); border-radius: 16px; padding: 10px 20px; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: #fff; background: linear-gradient(180deg, #8ef05a, var(--green) 45%, var(--green2)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .4), 0 4px 0 var(--gold3); transition: transform .12s; }
.gbtn.blue { background: linear-gradient(180deg, #6fc0ff, #2f86e0 45%, #1a5cb0); }
.gbtn.red { background: linear-gradient(180deg, #ff8a8a, var(--red) 45%, var(--red2)); }
.gbtn:active { transform: scale(.95); }
.gbtn:disabled { filter: grayscale(.8); cursor: not-allowed; }
.console { margin-top: 12px; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, #fffaf0, var(--cream2)); border: 3px solid var(--gold); box-shadow: 0 5px 0 var(--gold3), 0 12px 24px rgba(0, 0, 0, .35); }
.qhead { display: flex; align-items: center; gap: 10px; }
.qlabel { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); white-space: nowrap; }
.timer { flex: 1; height: 10px; border-radius: 999px; background: rgba(29, 35, 64, .12); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold)); transform-origin: left; }
.timer i.low { background: var(--red); }
.qtext { margin: 0; font-family: var(--display); font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 600; line-height: 1.3; min-height: 2.6em; text-align: center; color: var(--ink); text-wrap: balance; }
.boosters { display: flex; justify-content: center; gap: 14px; }
.boost { position: relative; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; padding: 6px; background: radial-gradient(circle at 40% 30%, #4fe0c8, #12a892); box-shadow: 0 4px 0 #0a6e60, 0 6px 10px rgba(0, 0, 0, .3); transition: transform .12s; }
.boost svg { width: 100%; height: 100%; }
.boost i { position: absolute; right: -8px; bottom: -6px; min-width: 22px; height: 20px; padding: 0 4px; border-radius: 10px; background: var(--navy2); color: #fff; font-style: normal; font-family: var(--display); font-weight: 700; font-size: .72rem; display: grid; place-items: center; border: 2px solid #fff; }
.boost:active { transform: scale(.92); }
.boost:disabled { filter: grayscale(.9); opacity: .6; cursor: not-allowed; }
.boost.armed { box-shadow: 0 0 0 4px var(--gold), 0 4px 0 #0a6e60; }
.answers { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .answers { grid-template-columns: 1fr 1fr; } }
.ans { position: relative; display: flex; align-items: center; justify-content: center; min-height: 54px; text-align: center; min-width: 0; font-family: var(--display); font-size: 1.15rem; font-weight: 600; color: var(--ink); background: #fff; border: 0; border-radius: 16px; padding: 10px 40px; cursor: pointer; box-shadow: 0 5px 0 #c9b48a, 0 8px 12px rgba(0, 0, 0, .12); transition: transform .12s, background .2s, color .2s; }
.ans kbd { position: absolute; left: 10px; font-family: var(--display); font-weight: 700; font-size: .72rem; color: #fff; background: var(--sea2); border-radius: 8px; width: 24px; height: 24px; display: grid; place-items: center; }
.ans:active:not(:disabled) { transform: translateY(3px) scale(.98); box-shadow: 0 2px 0 #c9b48a; }
.ans:disabled { cursor: default; opacity: .7; }
.ans.gone { visibility: hidden; }
.ans.right { opacity: 1; color: #fff; background: linear-gradient(180deg, #8ef05a, var(--green2)); box-shadow: 0 5px 0 var(--green3), 0 0 24px rgba(95, 209, 58, .8); animation: pop .4s; }
.ans.wrong { opacity: 1; color: #fff; background: linear-gradient(180deg, #ff8a8a, var(--red2)); box-shadow: 0 5px 0 #7a1020; animation: shake .4s; }
@keyframes pop { 50% { transform: scale(1.05); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.feedback { margin: 0; min-height: 1.4em; font-weight: 800; color: var(--ink2); text-align: center; }
.feedback.ok { color: var(--green3); } .feedback.bad { color: var(--red2); }
.battlehud { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chipx { display: flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 800; text-transform: uppercase; color: var(--ink2); background: rgba(29, 35, 64, .07); border-radius: 999px; padding: 4px 10px; }
.chipx b { font-family: var(--display); font-size: .95rem; color: var(--ink); }
.road { display: flex; gap: 3px; align-items: center; }
.road i { width: 9px; height: 9px; border-radius: 50%; background: rgba(29, 35, 64, .2); display: block; }
.road i.won { background: var(--gold2); } .road i.lost { background: var(--red); }
.road i.now { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--sea2); }
.road i.boss { width: 18px; border-radius: 5px; background: #8a4ad0; } .road i.devil { background: #8a1020; } .road i.devil.won { background: var(--gold2); }
#teamCount { display: inline-block; } #teamCount.bump { animation: bump .8s; color: var(--green2); }
@keyframes bump { 30% { transform: scale(1.8); } }

/* Kart listeleri: mağaza, sıralama, koleksiyon */
.ccard { border-radius: 20px; background: linear-gradient(180deg, #fffaf0, var(--cream2)); border: 3px solid var(--gold); box-shadow: 0 5px 0 var(--gold3), 0 10px 20px rgba(0, 0, 0, .3); overflow: hidden; }
.sect { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-align: center; padding: 8px; border-radius: 14px; background: linear-gradient(180deg, #c42c46, #8c1730); border: 2px solid #f4a0a8; box-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
.sect.blue { background: linear-gradient(180deg, #5a6cff, #3440b8); border-color: #a8b0ff; }

// WebGL yoksa düz harita
function refreshFlat(sts) {

    roots: [48, 43, 48, 48, 41, 48, 43, 48],

    bpm: 150,
    arp: [69, 72, 76, 72, 81, 76, 72, 76, 65, 69, 72, 69, 77, 72, 69, 72, 67, 71, 74, 71, 79, 74, 71, 74, 64, 68, 71, 68, 76, 71, 68, 71],

/* ---------- Efektler ---------- */
function burst(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 260; G.sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: .5 + Math.random() * .4, color }); }
}
function float(x, y, text, color, size = 20) { G.floaters.push({ x, y, text, color, size, life: 1.4 }); }

/* ---------- Güncelleme ---------- */
function update(dt) {
  G.t += dt;
  for (let i = G.timers.length - 1; i >= 0; i--) { const tm = G.timers[i]; tm.t -= dt; if (tm.t <= 0) { G.timers.splice(i, 1); tm.fn(); if (!G) return; } }
  const walking = G.phase === "walk" || G.phase === "approach";
  if (walking) {
    const d = WALK_SPEED * dt; G.worldX += d;
    if (G.phase === "walk") { G.walkLeft -= d; if (G.walkLeft <= 0) { const p = PLAN[G.step]; if (p === "s") spawnStranger(); else if (p === "d") spawnDevils(); else spawnBoss(); } }
  }
  if (G.stranger) {
    const s = G.stranger;
    s.facing = s.leaving ? 1 : -1;
    if (s.leaving) { s.x += 150 * dt; s.alpha -= dt * .6; s.phase += dt * 10; if (s.alpha <= 0) G.stranger = null; }
    else if (G.phase === "approach") { s.x -= WALK_SPEED * dt; if (s.x <= 735) { s.x = 735; G.phase = "question"; askQuestion(); } }
  }
  G.team.forEach(m => {
    const dx = m.tx - m.x;
    if (m.hold > 0) m.hold -= dt;
    const moving = Math.abs(dx) > 1 && !(m.hold > 0);
    if (moving) m.x += Math.sign(dx) * Math.min(Math.abs(dx), (m.joinPending ? 150 : 220) * dt);
    else if (m.joinPending && !(m.hold > 0)) { m.joinPending = false; onJoined(m); }
    m.cheer = Math.max(0, m.cheer - dt * 1.1);
    m.walking = walking || moving; m.facing = moving && !walking ? Math.sign(dx) : 1;
    if (m.walking) m.phase += dt * 10;
    m.recoil = Math.max(0, m.recoil - dt * 6);
    if (m.dying) { m.dying += dt; m.alpha = Math.max(0, 1 - m.dying); }
  });
  G.devils.forEach(d => {
    if (d.x > d.tx) { d.x = Math.max(d.tx, d.x - 150 * dt); d.phase += dt * 10; }
    d.attack = Math.max(0, d.attack - dt * 2);
    if (d.dying) { d.dying += dt; d.alpha = Math.max(0, 1 - d.dying); }
  });
  if (G.phase === "devilIntro" && G.devils.every(d => d.x <= d.tx)) { G.phase = "devil"; askQuestion(); }
  if (G.boss) {
    const b = G.boss;
    if (b.x > b.tx) b.x = Math.max(b.tx, b.x - 300 * dt);
    b.rise = Math.min(1, b.rise + dt * .7);
    b.flash = Math.max(0, b.flash - dt * 4); b.attack = Math.max(0, b.attack - dt * 1.6);
    if (b.dead) b.dead += dt;
  }
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const bl = G.bullets[i]; bl.x += bl.vx * dt; bl.y += bl.vy * dt;
    if (bl.target) {
      if (bl.x >= bl.target.x - 12) {
        G.bullets.splice(i, 1); burst(bl.x, bl.y, "#ffc857", 6);
        if (bl.kill && !bl.target.dying) { bl.target.dying = .0001; burst(bl.target.x, bl.target.y - 40 * PS, "#d21f2a", 22); float(bl.target.x, bl.target.y - 110 * PS, "Şeytan düştü!", "#ffc857"); sfx.hit(); }
      }
    } else if (G.boss && bl.x >= G.boss.x - 150) {
      G.bullets.splice(i, 1); burst(bl.x, bl.y, "#ffc857", 8);
      G.boss.flash = 1; G.shake = Math.max(G.shake, .15);
      if (bl.dmg) { G.boss.hp -= bl.dmg; float(G.boss.x - 60, 90, `-${bl.dmg}`, "#ffc857", 28); sfx.hit(); renderHud(); }
    } else if (bl.x > W + 20) G.bullets.splice(i, 1);
  }
  for (let i = G.fireballs.length - 1; i >= 0; i--) {
    const fb = G.fireballs[i], tx = fb.target.x, ty = fb.target.y - 40 * PS, dx = tx - fb.x, dy = ty - fb.y, dist = Math.hypot(dx, dy), sp = 620 * dt;
    if (dist <= sp) { G.fireballs.splice(i, 1); onFireballHit(fb); if (!G) return; }
    else { fb.x += dx / dist * sp; fb.y += dy / dist * sp; if (Math.random() < .7) G.sparks.push({ x: fb.x, y: fb.y, vx: 40, vy: -20 + Math.random() * 40, life: .35, color: fb.color }); }
  }
  for (let i = G.sparks.length - 1; i >= 0; i--) { const p = G.sparks[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; if (p.life <= 0) G.sparks.splice(i, 1); }
  for (let i = G.floaters.length - 1; i >= 0; i--) { const f = G.floaters[i]; f.life -= dt; f.y -= 40 * dt; if (f.life <= 0) G.floaters.splice(i, 1); }
  G.flakes.forEach(f => { f.y += f.v * dt; f.x -= (walking ? 40 : 10) * dt; if (f.y > H) { f.y = -4; f.x = Math.random() * W; } if (f.x < 0) f.x += W; });
  G.shake = Math.max(0, G.shake - dt);
  if (!G.locked && G.q) {
    G.qTimer -= dt; const r = Math.max(0, G.qTimer / Q_TIME);
    ui.tbar.style.transform = `scaleX(${r})`; $("qsec").textContent = Math.ceil(Math.max(0, G.qTimer)) + " sn"; ui.tbar.classList.toggle("low", r < .3);
    if (G.qTimer <= 0) answer(-1);
  }
}

/* ---------- Sahne çizimi ---------- */
function draw() {
  const c = G.c;
  ctx.save();
  ctx.translate(0, OFFY);
  if (G.shake > 0) ctx.translate((Math.random() - .5) * 14 * G.shake, (Math.random() - .5) * 10 * G.shake);
  const dk = G.boss ? Math.min(1, (W + 300 - G.boss.x) / 300) * .45 : 0;

  // gökyüzü

  sky.addColorStop(0, D(day.sky[0])); sky.addColorStop(.62, D(day.sky[1])); sky.addColorStop(1, hz);
  ctx.fillStyle = sky; ctx.fillRect(-20, -OFFY - 20, W + 40, GROUND + OFFY + 20);
  // güneş: yumuşak ışıma

  g.addColorStop(0, "rgba(255,250,215,.95)"); g.addColorStop(.18, "rgba(255,244,190,.55)"); g.addColorStop(1, "rgba(255,244,190,0)");
  ctx.fillStyle = g; ctx.fillRect(sx - 260, sy - 260, 520, 520);
  ctx.fillStyle = D("#fffbe6"); ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 7); ctx.fill();
  // bulutlar: alt tarafı gölgeli
  [[120, -110, 1.1, 6], [520, -60, .8, 9], [820, 10, 1, 4], [330, 40, .7, 7]].forEach(([x, y, s, v]) => {
    const xx = ((x - G.worldX * .03 - T * v) % (W + 260) + W + 260) % (W + 260) - 130;
    const cg = ctx.createLinearGradient(0, y - 40 * s, 0, y + 28 * s);
    cg.addColorStop(0, "rgba(255,255,255,.98)"); cg.addColorStop(1, "rgba(214,232,250,.92)");
    ctx.fillStyle = cg;
    [[0, 0, 26], [26, -12, 32], [56, 0, 24], [28, 6, 22]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(xx + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); });
  });

  // uzak dağlar → simge → yakın tepeler; aralarda pus (atmosferik derinlik)
  ridge(G.worldX * .08, 205, 70, D(day.hills[0]), .006, 1, c.snowcaps);
  haze(150, 300, hz, .45);
  const lx = 640 - Math.min(G.worldX * .1, 330);
  ctx.save(); ctx.translate(lx, 0); LANDMARK[c.landmark](D(shade(day.hills[1], -.2)), hz); ctx.restore();
  haze(170, 310, hz, .22);
  ridge(G.worldX * .3, 272, 32, D(day.hills[1]), .012, 2);
  if (c.lake) {
    const lg = ctx.createLinearGradient(0, 300, 0, GROUND); lg.addColorStop(0, D(shade(c.lake, .25))); lg.addColorStop(1, D(c.lake));
    ctx.fillStyle = lg; ctx.fillRect(-20, 300, W + 40, GROUND - 300);
    ctx.fillStyle = "rgba(255,255,255,.35)"; for (let i = 0; i < 18; i++) ctx.fillRect(((i * 131 - G.worldX * .4) % W + W) % W, 306 + (i % 4) * 7, 26, 1.5);
  }
  haze(260, 330, hz, .15);
  ridge(G.worldX * .55, 312, 14, D(day.hills[2]), .02, 3);

  // zemin: ışıktan gölgeye
  const gg = ctx.createLinearGradient(0, GROUND, 0, H - OFFY);
  gg.addColorStop(0, D(shade(c.ground[0], .12))); gg.addColorStop(1, D(shade(c.ground[0], -.18)));
  ctx.fillStyle = gg; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = D(shade(c.ground[1], .05)); ctx.globalAlpha = .55; ctx.fillRect(-20, GROUND, W + 40, 3); ctx.globalAlpha = 1;
  ctx.fillStyle = D(c.ground[2]); ctx.globalAlpha = .6;
  for (let i = 0; i < 24; i++) { const x = ((i * 113 - G.worldX) % (W + 60) + W + 60) % (W + 60) - 30; roundRect(x, GROUND + 18 + (i % 4) * 16, 18 + (i % 3) * 10, 4, 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 4; i++) { const x = ((i * 347 + 120 - G.worldX * .9) % (W + 200) + W + 200) % (W + 200) - 100; DECOR[c.decor](x, GROUND + 4, .7 + (i % 2) * .3, D); }

  if (G.boss) drawBossLayer(G.boss);
  if (G.stranger) drawPerson(G.stranger, !G.stranger.leaving && G.phase === "approach");
  G.devils.forEach(drawDevil);
  for (let i = G.team.length - 1; i >= 0; i--) drawPerson(G.team[i], G.team[i].walking, i === 0);

  // parlayan mermiler ve efektler

  G.bullets.forEach(b => {
    const bg = ctx.createLinearGradient(b.x - 34, 0, b.x + 4, 0); bg.addColorStop(0, "rgba(255,200,90,0)"); bg.addColorStop(1, "rgba(255,236,160,.95)");
    ctx.fillStyle = bg; roundRect(b.x - 34, b.y - 2.5, 38, 5, 2.5); ctx.fill();
  });
  G.fireballs.forEach(f => {
    const fg = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, 26);
    fg.addColorStop(0, "#ffffff"); fg.addColorStop(.35, f.color); fg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(f.x, f.y, 26, 0, 7); ctx.fill();
  });

  ctx.restore(); ctx.globalAlpha = 1;

  // ön plan: hızlı kayan çimen ve taşlar (derinlik)

// Dev türleri için ek görünümler (Tepegöz, Orman İyesi, Satir)
const baseBeast = CREATURE.beast;
CREATURE.beast = function (spec, t, b, out) {

  const atk = b.attack, br = Math.sin(t * 2) * 3;
  if (spec.lava) {

    ctx.strokeStyle = spec.lava; ctx.shadowColor = spec.lava; ctx.shadowBlur = 12; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-60, -230 + br); ctx.lineTo(-20, -180 + br); ctx.lineTo(-40, -130 + br); ctx.moveTo(30, -240 + br); ctx.lineTo(50, -190 + br); ctx.lineTo(20, -120 + br); ctx.stroke();

  if (spec.goat) { ctx.fillStyle = "#2a1a10"; [-72, 22].forEach(x => poly([[x, -6], [x + 50, -6], [x + 40, 4], [x + 10, 4]])); ctx.fillStyle = spec.dark; for (let i = 0; i < 8; i++) poly([[-72 + (i % 4) * 12 + (i > 3 ? 94 : 0), -100], [-66 + (i % 4) * 12 + (i > 3 ? 94 : 0), -112], [-60 + (i % 4) * 12 + (i > 3 ? 94 : 0), -100]]); }
  if (spec.tree) { ctx.fillStyle = shade(spec.dark, -.2); [-80, 14].forEach(x => { poly([[x, 0], [x - 20, 6], [x + 10, -6]]); poly([[x + 56, 0], [x + 76, 6], [x + 46, -6]]); }); }
  // gövde
  ctx.fillStyle = spec.body; roundRect(-100, -255 + br, 200, 175, 50); ctx.fill();
  if (spec.goat) { ctx.fillStyle = spec.dark; roundRect(-100, -110 + br, 200, 30, 10); ctx.fill(); }
  if (spec.tree) {
    ctx.strokeStyle = spec.dark; ctx.lineWidth = 4;
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-80 + i * 32, -240 + br); ctx.bezierCurveTo(-90 + i * 32, -200, -70 + i * 32, -150, -84 + i * 32, -90 + br); ctx.stroke(); }
    ctx.fillStyle = spec.leaves; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-80 + i * 40, -250 + br + (i % 2) * 10, 14, 0, 7); ctx.fill(); }
  }
  if (spec.cyclops) { ctx.fillStyle = shade(spec.body, -.25); roundRect(-100, -130 + br, 200, 50, 10); ctx.fill(); ctx.fillStyle = "#c9a227"; ctx.fillRect(-100, -132 + br, 200, 5); }
  // kollar
  const armL = -0.15 + Math.sin(t * 2) * .08 - atk * 1.6, armR = .15 - Math.sin(t * 2) * .08;
  [[-100, armL, -1], [100, armR, 1]].forEach(([sx, a, side]) => {

      ctx.lineWidth = 8; [[-14, 150], [4, 158], [20, 148]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.moveTo(side * 4, 120); ctx.lineTo(dx, dy); ctx.stroke(); });

    } else {
      ctx.fillStyle = spec.body; roundRect(-22 + side * 4, 0, 42, 130, 18); ctx.fill();
      ctx.fillStyle = shade(spec.body, -.1); roundRect(-20 + side * 4, 124, 36, 30, 12); ctx.fill();
    }
    if (spec.club && side < 0) { ctx.fillStyle = "#6a4a2a"; ctx.beginPath(); ctx.moveTo(-6, 150); ctx.lineTo(6, 150); ctx.lineTo(22, -70); ctx.lineTo(-24, -70); ctx.closePath(); ctx.fill(); ctx.fillStyle = "#4a3020"; [[-14, -40], [10, -20], [-4, 10]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); }); }
    ctx.restore();

  const hx = -10 - atk * 20, hy = -290 + br;
  if (spec.tree) {
    ctx.fillStyle = spec.leaves; [[-40, -40, 34], [10, -54, 38], [44, -30, 30], [-10, -20, 30]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(hx + dx, hy + dy, r, 0, 7); ctx.fill(); });
    ctx.fillStyle = spec.body; roundRect(hx - 38, hy - 30, 76, 74, 24); ctx.fill();
    ctx.fillStyle = "#14080e"; ctx.beginPath(); ctx.ellipse(hx - 14, hy, 9, 11, 0, 0, 7); ctx.ellipse(hx + 14, hy, 9, 11, 0, 0, 7); ctx.fill();
    ctx.shadowColor = spec.eye; ctx.shadowBlur = 14; ctx.fillStyle = spec.eye; ctx.beginPath(); ctx.arc(hx - 14, hy, 3.5, 0, 7); ctx.arc(hx + 14, hy, 3.5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#14080e"; ctx.beginPath(); ctx.ellipse(hx, hy + 26, 14, 4 + atk * 8, 0, 0, 7); ctx.fill();
  } else if (spec.goat) {
    ctx.strokeStyle = spec.horns; ctx.lineWidth = 9; ctx.lineCap = "round";
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(hx + s * 32, hy - 30, 16, Math.PI, Math.PI * 2.6); ctx.stroke(); });
    ctx.fillStyle = spec.face; ctx.beginPath(); ctx.ellipse(hx, hy, 34, 40, 0, 0, 7); ctx.fill();
    ctx.fillStyle = spec.dark; poly([[hx - 26, hy + 16], [hx, hy + 70], [hx + 26, hy + 16]]);
    ctx.beginPath(); ctx.ellipse(hx, hy - 34, 32, 14, 0, Math.PI, 0); ctx.fill();
    poly([[hx - 36, hy - 10], [hx - 54, hy - 24], [hx - 34, hy - 2]]); poly([[hx + 36, hy - 10], [hx + 54, hy - 24], [hx + 34, hy - 2]]);
    eye(hx - 13, hy - 6, 6, spec.eye, blinkAt(t)); eye(hx + 13, hy - 6, 6, spec.eye, blinkAt(t));
    ctx.fillStyle = "#2a0d1f"; ctx.beginPath(); ctx.ellipse(hx, hy + 18, 12, 3 + atk * 8, 0, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = spec.face; ctx.beginPath(); ctx.ellipse(hx, hy, 44, 46, 0, 0, 7); ctx.fill();
    ctx.fillStyle = spec.dark; ctx.beginPath(); ctx.ellipse(hx, hy - 30, 40, 18, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#f3e2c3"; poly([[hx - 6, hy - 40], [hx, hy - 66], [hx + 6, hy - 40]]);
    ctx.fillStyle = "#fbf1e1"; ctx.beginPath(); ctx.ellipse(hx, hy - 8, 20, 16 * blinkAt(t), 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#c2183a"; ctx.beginPath(); ctx.arc(hx - 4 - atk * 4, hy - 8, 8 * blinkAt(t), 0, 7); ctx.fill();
    ctx.fillStyle = "#14080e"; ctx.beginPath(); ctx.arc(hx - 5 - atk * 4, hy - 8, 4 * blinkAt(t), 0, 7); ctx.fill();
    ctx.fillStyle = "#2a0d1f"; ctx.beginPath(); ctx.ellipse(hx, hy + 24, 20, 5 + atk * 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#fbf1e1"; poly([[hx - 14, hy + 20], [hx - 10, hy + 30], [hx - 6, hy + 20]]); poly([[hx + 6, hy + 20], [hx + 10, hy + 30], [hx + 14, hy + 20]]);
  }
  out.x = hx - 50; out.y = hy + 20;

// Taş aslan (Karatepe) için aslan başlı sfenks
const baseSphinx = CREATURE.sphinx;
CREATURE.sphinx = function (spec, t, b, out) {
  baseSphinx(spec, t, b, out);
  if (!spec.lion) return;
  const atk = b.attack, br = Math.sin(t * 2) * 2, hx = -100 - atk * 20, hy = -210 + br;
  ctx.fillStyle = spec.mane;
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; poly([[hx + Math.cos(a) * 40, hy + Math.sin(a) * 40], [hx + Math.cos(a + .22) * 78, hy + Math.sin(a + .22) * 78], [hx + Math.cos(a + .44) * 40, hy + Math.sin(a + .44) * 40]]); }

  ctx.fillStyle = shade(spec.body, .2); ctx.beginPath(); ctx.ellipse(hx - 14, hy + 26, 24, 18, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#3a2a1a"; ctx.beginPath(); ctx.ellipse(hx - 14, hy + 14, 9, 6, 0, 0, 7); ctx.fill();
  eye(hx - 22, hy - 8, 7, spec.eye, blinkAt(t)); eye(hx + 10, hy - 8, 7, spec.eye, blinkAt(t));
  ctx.fillStyle = "#2a0d1f"; ctx.beginPath(); ctx.ellipse(hx - 14, hy + 36, 18, 4 + atk * 12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#fbf1e1"; poly([[hx - 26, hy + 32], [hx - 22, hy + 42], [hx - 18, hy + 32]]); poly([[hx - 8, hy + 32], [hx - 4, hy + 42], [hx, hy + 32]]);

/* ---------- Ölçekleme ve döngü ---------- */
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = bc.width = Math.max(1, Math.round(r.width * dpr)); cv.height = bc.height = Math.max(1, Math.round(r.height * dpr));
}
window.addEventListener("resize", () => { if (view === "battle") resize(); });
const proCv = $("proCv"), proCtx = proCv.getContext("2d");
let last = performance.now(), lastTop = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; T = now / 1000;
  if (view === "profile") {
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = Math.round(proCv.clientWidth * dpr), h = Math.round(proCv.clientHeight * dpr);
    if (w && (proCv.width !== w || proCv.height !== h)) { proCv.width = w; proCv.height = h; }
    ctx = proCtx; ctx.setTransform(proCv.width / W, 0, 0, proCv.height / H, 0, 0);
    try { drawProfileScene(dt); } finally { ctx = mainCtx; }
  }
  const want = view !== "battle" || !G || !running || G.phase === "win" || G.phase === "lose" ? null : (G.boss || G.devils.length) ? "battle" : "march";
  Music.play(want);
  if (G && view === "battle") {
    if (running) update(dt);
    if (G) { mainCtx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); draw(); }
  }
  if (now - lastTop > 1000) { lastTop = now; renderTop(); }
}

/* ---------- Güçlendiriciler ---------- */
function boosterUI() {
  const active = !!(G && !G.locked && G.q);
  $("nBomb").textContent = save.items.bomb; $("nCheck").textContent = save.items.check; $("nTime").textContent = save.items.time; $("nShield").textContent = save.items.shield;
  $("bBomb").disabled = !active || !save.items.bomb || G.q.bombed;
  $("bCheck").disabled = !active || !save.items.check;
  $("bTime").disabled = !active || !save.items.time;
  $("bShield").disabled = !G || !!G.shield || !save.items.shield || !(G.boss || G.devils.length);
  $("bShield").classList.toggle("armed", !!(G && G.shield));
}
$("bBomb").addEventListener("click", () => {
  if (!G || G.locked || !G.q || G.q.bombed || !save.items.bomb) return;
  save.items.bomb--; persist(); G.q.bombed = true;
  shuffle([0, 1, 2, 3].filter(k => k !== G.q.right)).slice(0, 2).forEach(k => { ui.ans[k].classList.add("gone"); ui.ans[k].disabled = true; });
  sfx.shot(); boosterUI();
});
$("bCheck").addEventListener("click", () => { if (!G || G.locked || !G.q || !save.items.check) return; save.items.check--; persist(); answer(G.q.right); boosterUI(); });
$("bTime").addEventListener("click", () => { if (!G || G.locked || !G.q || !save.items.time) return; save.items.time--; persist(); G.qTimer += 10; toast("+10 saniye"); boosterUI(); });
$("bShield").addEventListener("click", () => { if (!G || G.shield || !save.items.shield) return; save.items.shield--; persist(); G.shield = true; toast("Kalkan hazır"); boosterUI(); });

/* ---------- Girdiler ---------- */
ui.ans.forEach((b, i) => b.addEventListener("click", () => answer(i)));
$("backBtn").addEventListener("click", showMap);
$("playBtn").addEventListener("click", () => { ensureAudio(); playSelected(); });
$("worldBtn").addEventListener("click", () => showView("world"));
$("worldClose").addEventListener("click", () => showView("home"));
$("questBtn").addEventListener("click", questsModal);
$("gearBtn").addEventListener("click", settingsModal);
$("avatarBtn").addEventListener("click", () => showView("profile"));
$("coinPlus").addEventListener("click", () => showView("shop"));
$("mClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => showView(t.dataset.view)));
$("segScore").addEventListener("click", () => { lbSort = "score"; renderLB(); });
$("segConq").addEventListener("click", () => { lbSort = "tr"; renderLB(); });
$("nickInput").addEventListener("input", e => { profile.nick = e.target.value.slice(0, 20); persistProfile(); renderTop(); });
window.addEventListener("pointerdown", () => Music.init(), { once: true });
window.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modal").hidden) return closeModal();
  if (view !== "battle" || !G || !ui.overlay.hidden || e.target.tagName === "INPUT") return;
  const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 }, k = e.key.toLowerCase();
  if (k in map && !ui.ans[map[k]].disabled) { e.preventDefault(); answer(map[k]); }
});

/* ---------- Başlat ---------- */
if (use3d) {
  try {
    homeMap = createMap3D($("map3d"), $("labels3"), "tr"); homeMap.buildTR(TR_CITIES);
    homeMap.onPick((i, dbl) => { selectCity(i); if (dbl) playSelected(); });
    globeMap = createMap3D($("globe3d"), $("globeLabels"), "globe"); globeMap.buildGlobe(CHAPTERS.slice(0, -1));
    globeMap.onPick(i => chooseChapter(i));
  } catch (e) { homeMap = globeMap = null; }
}
if (save.tr.start) { const i = TR_CITIES.findIndex(c => c.id === save.tr.start); const open = TR_CITIES.findIndex((c, j) => trState(j) === "open"); selected = open >= 0 ? open : Math.max(0, i); }
else selected = TR_CITIES.findIndex(c => c.plate === 6);
showView(profile.nick ? "home" : "profile");
if (homeMap) homeMap.focus(selected, save.tr.start ? .75 : 1);
requestAnimationFrame(() => renderTopAvatar());
requestAnimationFrame(frame);
initCloud();
window.BilgiOrdusu = { showView, startCity: i => beginBattle(mode, i), selectCity, state: () => G, save: () => save, list: () => LIST };
})();
