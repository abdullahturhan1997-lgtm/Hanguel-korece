<body>
<title>Bilgi Ordusu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column "field radio" — HUD strip, wide stage (world map or battlefield), console below. Single dusk look on purpose. */
:root {
  --ink: #1b1428;
  --panel: #271d3a;
  --line: #3d2f57;
  --paper: #fbf1e1;
  --muted: #b9a9cf;
  --ember: #ff7a3d;
  --sun: #ffc857;
  --ok: #4fd18b;
  --bad: #ff4d6a;
  --sea: #21183a;
  --land: #4b3768;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 16px; }
.wrap {
  max-width: 1000px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; }
.brand { font-family: var(--display); font-size: 1.35rem; letter-spacing: .02em; color: var(--sun); margin: 0; line-height: 1; font-weight: 400; }
.brand span { color: var(--ember); }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.stat { display: flex; align-items: center; gap: 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; letter-spacing: 0; color: var(--paper); font-variant-numeric: tabular-nums; }
.road { display: flex; gap: 4px; align-items: center; }
.road i { width: 12px; height: 12px; border-radius: 3px; background: var(--line); display: block; transition: background .3s; }
.road i.won { background: var(--ok); }
.road i.lost { background: var(--bad); }
.road i.now { outline: 2px solid var(--sun); outline-offset: 1px; }
.road i.boss { width: 22px; background: #5a2f6e; }
.road i.boss.now { background: var(--ember); }

.stage { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--line); aspect-ratio: 960 / 420; max-width: 100%; background: var(--sea); }
canvas { display: block; width: 100%; height: 100%; }

/* Harita */
.map { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--sea); }
.map .grat { stroke: #2f2450; stroke-width: 1; fill: none; }
.map .landp { fill: var(--land); stroke: #6b5390; stroke-width: .8; }
.map .route { fill: none; stroke: var(--sun); stroke-width: 1.6; stroke-dasharray: 5 6; opacity: .55; }
.pin { cursor: pointer; outline: none; }
.pin circle.dot { fill: #6f6386; stroke: var(--ink); stroke-width: 2; }
.pin.open circle.dot { fill: var(--ember); }
.pin.done circle.dot { fill: var(--ok); }
.pin circle.hit { fill: transparent; }
.pin circle.ring { fill: none; stroke: var(--sun); stroke-width: 2.5; opacity: 0; }
.pin.sel circle.ring { opacity: 1; animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.pin:focus-visible circle.ring { opacity: 1; stroke: var(--paper); }
.pin text { font-family: var(--display); font-size: 12px; fill: var(--paper); paint-order: stroke; stroke: var(--ink); stroke-width: 3.5px; pointer-events: none; }
.pin.locked text { fill: #8f83a6; }
@keyframes pulse { 50% { transform: scale(1.35); } }
@media (max-width: 640px) { .pin text { display: none; } }
.maptitle { position: absolute; left: 12px; bottom: 10px; font-family: var(--display); font-size: .8rem; color: var(--muted); letter-spacing: .06em; pointer-events: none; }

/* Savaş rozetleri */
.citybadge {
  position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 8px;
  background: rgba(20, 12, 32, .72); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 6px 10px 6px 6px;
  max-width: calc(50% - 20px);
}
.citybadge img { width: 42px; height: 28px; border-radius: 3px; display: block; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.citybadge div { display: flex; flex-direction: column; min-width: 0; }
.citybadge b { font-family: var(--display); font-weight: 400; font-size: clamp(.7rem, 2vw, 1rem); line-height: 1.1; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citybadge small { font-size: clamp(.6rem, 1.5vw, .75rem); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.backbtn {
  position: absolute; right: 10px; top: 10px; font-family: var(--body); font-weight: 500; font-size: .78rem;
  background: rgba(20, 12, 32, .72); color: var(--paper); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
.backbtn:hover { border-color: var(--sun); }
.bosshp { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(38%, 360px); display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
.bosshp small { font-family: var(--display); font-size: clamp(.55rem, 1.6vw, .8rem); letter-spacing: .04em; color: var(--paper); text-shadow: 0 2px 0 rgba(0,0,0,.5); text-align: center; }
.bar { width: 100%; height: 12px; border-radius: 6px; background: rgba(0,0,0,.45); border: 2px solid rgba(0,0,0,.6); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bad), var(--ember)); transition: width .4s ease; }
@media (max-width: 560px) { .bosshp { top: auto; bottom: 8px; width: 60%; } }

.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 16px; background: rgba(20, 12, 32, .66); backdrop-filter: blur(2px);
}
@media (max-width: 600px) {
  .stage:has(> .overlay:not([hidden])) { aspect-ratio: auto; }
  .stage:has(> .overlay:not([hidden])) canvas { position: absolute; inset: 0; }
  .overlay { position: relative; inset: auto; min-height: 100%; padding-block: 56px 20px; }
}
.overlay h2 { font-family: var(--display); margin: 0; font-weight: 400; font-size: clamp(1.6rem, 6vw, 3.4rem); line-height: 1; color: var(--sun); text-shadow: 0 4px 0 #7a2e1b; text-wrap: balance; }
.overlay p { margin: 0; max-width: 46ch; color: var(--paper); line-height: 1.45; font-size: clamp(.8rem, 2.2vw, 1rem); text-wrap: balance; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  font-family: var(--display); font-weight: 400; font-size: 1rem; letter-spacing: .03em; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer;
  background: var(--ember); color: var(--ink); box-shadow: 0 4px 0 #9c3a14; transition: transform .08s, box-shadow .08s;
}
.btn.ghost { background: #3c2e57; color: var(--paper); box-shadow: 0 4px 0 #1f1630; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c3a14; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .ans:focus-visible, .chip:focus-visible, .backbtn:focus-visible, .nav:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.console { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Şehir kartı */
.card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.card .flag { width: 84px; height: 56px; border-radius: 4px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.card .info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.35rem; line-height: 1.05; color: var(--paper); }
.card .country { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.card .foe { margin: 0; font-weight: 700; color: var(--sun); }
.card .lore { margin: 0; color: var(--paper); line-height: 1.45; max-width: 62ch; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.card .meta b { color: var(--paper); font-weight: 500; }
.cardfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.navs { display: flex; gap: 8px; }
.nav { font-family: var(--display); font-size: 1rem; width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: #33274b; color: var(--paper); cursor: pointer; }
.nav:hover { border-color: var(--sun); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 6px; font-family: var(--body); font-size: .8rem; color: var(--paper);
  background: #33274b; border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; cursor: pointer;
}
.chip img { width: 22px; height: 15px; border-radius: 2px; display: block; }
.chip.sel { border-color: var(--sun); }
.chip.locked { opacity: .5; }
.chip.done::after { content: "✓"; color: var(--ok); font-weight: 700; }
@media (max-width: 480px) { .card { grid-template-columns: 1fr; } }

/* Soru */
.qhead { display: flex; align-items: center; gap: 12px; }
.qlabel { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
.timer { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--sun); transform-origin: left; }
.timer i.low { background: var(--bad); }
.qtext { margin: 0; font-size: clamp(1.05rem, 2.6vw, 1.3rem); font-weight: 500; line-height: 1.35; min-height: 2.7em; text-wrap: balance; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .answers { grid-template-columns: 1fr; } }
.ans {
  display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0; font-family: var(--body); font-size: 1rem; color: var(--paper);
  background: #33274b; border: 2px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer;
  transition: background .15s, border-color .15s, transform .08s;
}
.ans kbd { font-family: var(--display); font-size: .8rem; color: var(--ink); background: var(--muted); border-radius: 5px; padding: 3px 7px; flex: none; }
.ans:hover:not(:disabled) { border-color: var(--sun); background: #3c2e57; }
.ans:active:not(:disabled) { transform: translateY(2px); }
.ans:disabled { cursor: default; opacity: .55; }
.ans.right { border-color: var(--ok); background: #1f4a3a; opacity: 1; }
.ans.right kbd { background: var(--ok); }
.ans.wrong { border-color: var(--bad); background: #4d1f2c; opacity: 1; }
.ans.wrong kbd { background: var(--bad); }
.feedback { margin: 0; min-height: 1.4em; font-weight: 500; color: var(--muted); }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.hint { margin: 0; font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar i, .road i { transition: none; } .pin.sel circle.ring { animation: none; } }
</style>

let actx = null;

function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); }
function shade(c, k) { const A = hex(c); return "#" + A.map(v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k).toString(16).padStart(2, "0")).join(""); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function star(g, x, y, r, rot = -Math.PI / 2, inner = .38) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, rr = i % 2 ? r * inner : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
function poly(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); }

  }

/* ---------- İnsanlar ---------- */
function drawPerson(m, walking, isHero) {
  const x = m.x, y = m.y;
  ctx.save(); ctx.globalAlpha = Math.max(0, m.alpha ?? 1); ctx.translate(x, y);
  if (m.dying) ctx.rotate(-Math.min(1, m.dying * 2) * 1.4);
  ctx.scale((m.facing || 1) < 0 ? -1 : 1, 1);
  const sw = walking ? Math.sin(m.phase) : 0, bob = walking ? Math.abs(Math.sin(m.phase)) * -2 : 0;
  const cloth = m.joined ? m.color : "#8b7f99";
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(0, 2, 18, 4, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "#2b2236"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-3, -24 + bob); ctx.lineTo(-3 + sw * 10, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, -24 + bob); ctx.lineTo(4 - sw * 10, -2); ctx.stroke();
  ctx.translate(0, bob);
  ctx.fillStyle = cloth; roundRect(-11, -56, 22, 34, 6); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(-11, -30, 22, 5);
  const rc = m.recoil * -6;
  ctx.fillStyle = "#1f1a26"; ctx.fillRect(2 + rc, -46, 34, 7); ctx.fillRect(10 + rc, -41, 6, 9);
  ctx.fillStyle = "#4a4157"; ctx.fillRect(30 + rc, -45, 8, 4);
  if (m.recoil > .6) { ctx.fillStyle = "#ffe08a"; ctx.beginPath(); ctx.arc(42 + rc, -43, 6, 0, 7); ctx.fill(); }
  ctx.strokeStyle = cloth; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(12 + rc, -40); ctx.stroke();
  ctx.fillStyle = m.skin; ctx.beginPath(); ctx.arc(1, -67, 10, 0, 7); ctx.fill();
  ctx.fillStyle = "#2b2236"; ctx.fillRect(4, -69, 3, 3);
  ctx.fillStyle = isHero ? "#2b2236" : shade(cloth, -.35); ctx.beginPath(); ctx.arc(1, -69, 10.5, Math.PI, 0); ctx.fill();
  if (isHero) { ctx.fillStyle = "#ffc857"; ctx.fillRect(-9, -70, 20, 3); }
  ctx.restore();
  if (m.bubble && (!m.joined || m.leaving)) {
    ctx.save(); ctx.globalAlpha = Math.max(0, m.alpha);
    const bx = x, by = y - 104 + Math.sin(G.t * 4) * 3;
    ctx.fillStyle = "#fbf1e1"; roundRect(bx - 16, by - 18, 32, 30, 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - 5, by + 12); ctx.lineTo(bx, by + 20); ctx.lineTo(bx + 5, by + 12); ctx.fill();
    ctx.fillStyle = m.leaving ? "#ff4d6a" : "#1b1428"; ctx.font = "20px Bungee, Impact, sans-serif"; ctx.textAlign = "center"; ctx.fillText(m.bubble, bx, by + 6);
    ctx.restore();
  }
  if (isHero && !m.dying) { ctx.font = "11px Bungee, Impact, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#ffc857"; ctx.fillText("SEN", x, y - 86); }
}

/* ---------- Canavarlar ---------- */
function drawBossLayer(b) {
  const spec = G.c.boss;
  // canavarı ayrı katmana çiz, vurulunca beyaz parlat
  ctx = bctx;
  bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, bc.width, bc.height);
  bctx.setTransform(bc.width / W, 0, 0, bc.height / H, 0, 0);
  const deadK = b.dead ? Math.min(1, b.dead / 1.4) : 0;
  ctx.save();
  ctx.translate(b.x, GROUND + deadK * 80 + (spec.water ? (1 - b.rise) * 160 : 0));
  ctx.translate(b.attack * -30, 0);
  const local = { x: -100, y: -200 };
  const sc = spec.type === "beast" ? .8 : spec.type === "neck" && !spec.water ? .88 : 1;
  ctx.scale(sc, sc);
  CREATURE[spec.type](spec, G.t, b, local);
  local.x *= sc; local.y *= sc;
  ctx.restore();
  b.mouth = { x: b.x + local.x, y: GROUND + local.y };
  if (b.flash > .05) { ctx.globalCompositeOperation = "source-atop"; ctx.fillStyle = `rgba(255,255,255,${b.flash * .8})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = "source-over"; }
  ctx = mainCtx;
  ctx.save(); ctx.globalAlpha = 1 - deadK * .95; ctx.drawImage(bc, 0, 0, W, H); ctx.restore();
  if (spec.water || G.c.lake) {
    // canavarın önündeki su
    const wx = b.x - 190;
    ctx.fillStyle = shade(G.c.lake || "#2c5a7a", -.1);
    ctx.beginPath(); ctx.moveTo(wx, H + 10); ctx.lineTo(wx, GROUND + 6);
    for (let x = wx; x <= W + 20; x += 10) ctx.lineTo(x, GROUND - 2 + Math.sin(x * .05 + G.t * 3) * 4);
    ctx.lineTo(W + 20, H + 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    for (let i = 0; i < 10; i++) ctx.fillRect(wx + 20 + ((i * 53 + G.t * 30) % (W - wx)), GROUND + 10 + (i % 4) * 14, 22, 2);
  }
}

function eye(x, y, r, color, blink = 1) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, r, r * blink, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#1a0a14"; ctx.beginPath(); ctx.ellipse(x - r * .25, y, r * .35, r * .55 * blink, 0, 0, 7); ctx.fill();
}
function blinkAt(t, k = 0) { return Math.sin(t * 1.3 + k) > .97 ? .15 : 1; }

/* Ejder kafası: sola bakar */

/* ---------- Ölçekleme ve döngü ---------- */
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = bc.width = Math.max(1, Math.round(r.width * dpr)); cv.height = bc.height = Math.max(1, Math.round(r.height * dpr));

window.addEventListener("resize", resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && !cv.hidden) {
    if (running) update(dt);
    if (G) { mainCtx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); draw(); }
  }
  requestAnimationFrame(frame);
}

/* ---------- Girdiler ---------- */
ui.ans.forEach((b, i) => b.addEventListener("click", () => answer(i)));
ui.goBtn.addEventListener("click", () => startCity(selected));
