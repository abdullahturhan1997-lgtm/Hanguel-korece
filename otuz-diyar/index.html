<style>

:root {

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--lapis2); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font-family: var(--display); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }

/* alt panel */
.panel { flex: none; padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, var(--parch), var(--parch2)); border-top: 2px solid var(--gold); min-height: 92px; display: flex; flex-direction: column; gap: 8px; }
.panel h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }

.btn { border: 2px solid var(--gold); border-radius: 10px; padding: 7px 12px; background: var(--lapis); color: #fff6d8; font-weight: 700; font-size: .92rem; box-shadow: 0 2px 0 var(--lapis2); }

.start .page { max-width: 980px; margin: 0 auto; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { background: linear-gradient(180deg, var(--parch), var(--parch2)); border: 3px solid var(--gold); outline: 6px solid var(--lapis); outline-offset: 0; border-radius: 4px; padding: 16px; box-shadow: 0 0 0 9px var(--gold) ; }

.ribbon { display: block; width: fit-content; margin: 0 auto 10px; padding: 4px 22px; background: var(--lapis); color: var(--gold2); font-family: var(--display); font-weight: 700; clip-path: polygon(0 50%, 12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%); }

.battle .title { flex: none; text-align: center; padding: 6px; background: var(--lapis); color: var(--gold2); font-family: var(--display); font-weight: 700; letter-spacing: .05em; border-bottom: 2px solid var(--gold); }

.result { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(88%, 380px); padding: 16px; text-align: center; background: linear-gradient(180deg, var(--parch), var(--parch2)); border: 3px solid var(--gold); outline: 4px solid var(--lapis); border-radius: 4px; display: flex; flex-direction: column; gap: 8px; align-items: center; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

  const c = document.createElement("canvas"); c.width = AW; c.height = AH; const x = c.getContext("2d");
  // yaldız gökyüzü ve kıvrımlı bulutlar
  const sk = x.createLinearGradient(0, 0, 0, 300); sk.addColorStop(0, "#d8b040"); sk.addColorStop(1, "#ecd486"); x.fillStyle = sk; x.fillRect(0, 0, AW, 330);
  x.strokeStyle = "rgba(160,110,20,.35)"; x.lineWidth = 2; for (let k = 0; k < 140; k++) { const px = (k * 197) % AW, py = 20 + (k * 71) % 250; x.beginPath(); x.arc(px, py, 6, Math.PI, Math.PI * 1.8); x.arc(px + 11, py, 5, Math.PI * 1.1, Math.PI * 2); x.stroke(); }
  for (let k = 0; k < 9; k++) { const cx = 80 + k * 210, cy = 60 + (k % 3) * 26; x.fillStyle = "#3a5ab0"; x.strokeStyle = "#f4efe2"; x.lineWidth = 3; x.beginPath(); for (let j = 0; j < 4; j++) x.arc(cx + j * 14, cy - (j % 2) * 6, 9, Math.PI, 0); x.fill(); x.stroke(); }
  // ufukta diyarın şehri
  x.save(); x.globalAlpha = .92; for (let k = 0; k < 4; k++) drawCastle(x, R, 220 + k * 460 + (k % 2) * 60, 322, k % 2 ? 2.2 : 2.8, R.renk); x.restore();
  // ağaç sırası
  for (let k = 0; k < 26; k++) { const px = 30 + k * 70, py = 336; if (k % 2) { x.fillStyle = "#2f6b47"; x.strokeStyle = INK; x.lineWidth = 1.4; x.beginPath(); x.ellipse(px, py - 26, 9, 30, 0, 0, 7); x.fill(); x.stroke(); } else { x.fillStyle = "#6a4a2a"; x.fillRect(px - 2, py - 16, 4, 16); x.fillStyle = "#e8b8c8"; x.beginPath(); x.arc(px, py - 26, 15, 0, 7); x.fill(); x.stroke(); x.fillStyle = "#c86a8a"; for (let j = 0; j < 6; j++) { x.beginPath(); x.arc(px - 9 + j * 3.6, py - 30 + (j % 3) * 5, 1.6, 0, 7); x.fill(); } } }
  // meydan zemini
  const gr = x.createLinearGradient(0, 330, 0, AH); gr.addColorStop(0, "#d9c088"); gr.addColorStop(1, "#c8a868"); x.fillStyle = gr; x.fillRect(0, 336, AW, AH - 336);
  x.strokeStyle = "#5a3a1a"; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 338); x.lineTo(AW, 338); x.stroke();
  x.strokeStyle = "rgba(90,110,50,.55)"; x.lineWidth = 1.4; for (let k = 0; k < 260; k++) { const px = (k * 131) % AW, py = 350 + (k * 53) % 230; x.beginPath(); x.moveTo(px, py); x.lineTo(px - 2, py - 5); x.moveTo(px + 2, py); x.lineTo(px + 3, py - 5); x.stroke(); }
  // ön çiçek bordürü
  x.fillStyle = "#2f6b47"; x.fillRect(0, AH - 26, AW, 26); for (let k = 0; k < 90; k++) { const px = 10 + k * 20; x.fillStyle = ["#c8402e", "#f4efe2", "#e8c040", "#c46a7d"][k % 4]; x.beginPath(); x.arc(px, AH - 13, 4, 0, 7); x.fill(); }
  return c;
}
function drawArena() {
  if (!B) return;
  const W = acv.width, H = acv.height, sc = Math.min(H / AH, W / 560), vw = W / sc, vh = H / sc, oy = Math.max(0, vh - AH); B.sc = sc / (acv.width / acv.clientWidth);
  const key = B.bg.k; if (arenaBgKey !== key) { arenaBg = paintArenaBg(B.bg); arenaBgKey = key; }
  const liveU = B.units.filter(u => u.hp > 0), mx = liveU.length ? liveU.reduce((a, u) => a + u.x, 0) / liveU.length : AW / 2;
  B.camX += (clamp(mx + B.pan, vw / 2, AW - vw / 2) - B.camX) * .08;
  const ox = vw >= AW ? (vw - AW) / 2 : -(B.camX - vw / 2);
  ag.setTransform(sc, 0, 0, sc, ox * sc, oy * sc);
  { const sk = ag.createLinearGradient(0, -oy, 0, 10); sk.addColorStop(0, "#c89a30"); sk.addColorStop(1, "#d8b040"); ag.fillStyle = sk; ag.fillRect(-ox, -oy, vw, oy + 10); }
  ag.drawImage(arenaBg, 0, 0);
  ag.fillStyle = "#c8a868"; ag.fillRect(-ox, -2, Math.max(0, -ox), 0);
  const list = B.units.filter(u => u.dead < 1 || u.hp > 0).sort((p, q) => p.r - q.r || p.x - q.x);
  for (const u of list) {
    const y = rowY(u.r), s = rowS(u.r) * (u.big ? 1.25 : 1.5);
    ag.fillStyle = "rgba(60,40,10,.25)"; ag.beginPath(); ag.ellipse(u.x, y + 1, 12 * s * BODY[u.R.body].sz, 3 * s, 0, 0, 7); ag.fill();
    drawFig(ag, u.R, { x: u.x, y, s, dir: u.dir, ph: u.ph, walk: u.walk && u.hp > 0, atk: u.atkT, draw: u.drawT, dead: u.hp <= 0 ? Math.max(.01, u.dead) : 0, alpha: u.hp <= 0 ? .55 + .45 * (1 - u.dead) : 1 });
    if (u.hp > 0 && u.hp < u.mhp) { ag.fillStyle = "rgba(43,29,18,.6)"; ag.fillRect(u.x - 9, y - 70 * s / 1.5 - 4, 18, 3); ag.fillStyle = u.side ? "#c8402e" : "#2f9d5f"; ag.fillRect(u.x - 9, y - 70 * s / 1.5 - 4, 18 * u.hp / u.mhp, 3); }
  }
  ag.strokeStyle = "#3a2418"; ag.lineWidth = 1.6;
  for (const a of B.arrows) { const k = a.t / a.T, x = lerp(a.x, a.tx, k), y = lerp(a.y, a.ty, k) - Math.sin(k * Math.PI) * 90, k2 = Math.min(1, k + .04), x2 = lerp(a.x, a.tx, k2), y2 = lerp(a.y, a.ty, k2) - Math.sin(k2 * Math.PI) * 90, an = Math.atan2(y2 - y, x2 - x); ag.beginPath(); ag.moveTo(x - Math.cos(an) * 12, y - Math.sin(an) * 12); ag.lineTo(x, y); ag.stroke(); }
}

/* ---------- açılış ---------- */
let chosen = -1;
function showStart() {
  S = null; $("start").hidden = false; const box = $("raceList"); box.replaceChildren();
  Object.entries(ZONES).forEach(([z, zn]) => {
    const rs = RACES.filter(R => R.zone === z); if (!rs.length) return;
    box.appendChild(el("div", "zone", zn)); const grid = el("div", "races");
    rs.forEach(R => {
      const b = el("button", "race"); b.type = "button"; b.setAttribute("aria-pressed", "false");
      const c = document.createElement("canvas"); c.width = 140; c.height = 168; b.append(c, el("b", null, R.ad), el("small", null, R.sehir));
      const x = c.getContext("2d"), big = BODY[R.body].sz; drawFig(x, R, { x: 64, y: 160, s: (big > 1.3 ? 2.9 : 3.3) / Math.max(1, big), dir: 1 });
      b.addEventListener("click", () => { chosen = R.i; box.querySelectorAll(".race").forEach(e => e.setAttribute("aria-pressed", String(e === b))); const go = $("goBtn"); go.disabled = false; go.textContent = `${R.ad} ile başla`; });
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
  $("contBtn").hidden = !loadGame();
}
function begin(st) {
  S = st; $("start").hidden = true; sel = null; mode = null; B = null; battleOpen = null; $("battle").hidden = true;
  paintTerritory(); drawCrest(); resizeMap();
  const c = owned(S.P)[0] || S.cities[S.P]; cam = { x: c.x, y: c.y, z: .62 }; clampCam();
  $("speedBtn").textContent = S.speed + "×"; renderPanel(); renderTop();
}
$("goBtn").addEventListener("click", () => { if (chosen < 0) return; newGame(chosen); begin(S); saveGame(); });
$("contBtn").addEventListener("click", () => { const s = loadGame(); if (s) begin(s); });

/* ---------- döngü ---------- */
let last = performance.now(), saveT = 0, panelT = 0, lastKey = "";
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (toastT > 0 && (toastT -= dt) <= 0) $("toast").hidden = true;
  if (!S) return;
  if (B) { for (let i = 0; i < B.speed; i++) stepBattle(dt); drawArena(); return; }
  if (!S.over) for (let i = 0; i < S.speed; i++) { update(dt); if (battleOpen) break; }
  drawMap(now / 1000);
  if ((panelT -= dt) <= 0) { panelT = .5; renderTop(); const k = panelKey(); if (!mode && !S.over && k !== lastKey) { lastKey = k; renderPanel(); } }
  if ((saveT += dt) > 6) { saveT = 0; saveGame(); }
}
window.addEventListener("resize", () => { if (S) resizeMap(); if (B) resizeArena(); });
new ResizeObserver(() => { if (S) resizeMap(); }).observe(cv);
genWorld(); mines0 = genMines(); showStart(); requestAnimationFrame(frame);
window.OtuzDiyar = { state: () => S, battle: () => B, newGame: i => { newGame(i); begin(S); } };
</script>
