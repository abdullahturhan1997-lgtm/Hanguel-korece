name: Fetih Oyunu APK Olustur

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'FetihOyunu/**'
      - '.github/workflows/fetih-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: APK dosyasini olustur
        working-directory: FetihOyunu
        run: gradle :app:assembleDebug --no-daemon

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Fetih-Oyunu-APK
          path: FetihOyunu/app/build/outputs/apk/debug/app-debug.apk
